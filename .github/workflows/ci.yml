name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三平台都跑，本项目是跨平台 CLI。
        # 注意：不要测 Node 20 —— 它需要 ESM 顶层 await + node --test 的
        # 较新行为，且 GitHub 已把 Node 20 runner 强制迁到 Node 24，
        # 版本号与实际运行时会不一致，CI 结果没有参考价值。
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (仅 devDependency：typescript)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Protocol E2E (TCP hub + 3 peers)
        run: npm run smoke

      - name: Game auto-play (三款游戏跑到结束)
        run: npm run sim

      - name: CLI sanity (离线命令不依赖网络)
        run: |
          node ./dist/cli/main.js --version
          node ./dist/cli/main.js id
          node ./dist/cli/main.js art jupiter --plain
